<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/profile.css" />
  

  <!-- Firebase SDK — order matters, keep exactly this sequence -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label sidebar-brand">Code Review Agent</span>
      </button>
    </div>

    <nav class="nav" aria-label="Main navigation">
      <a href="dashboard.html" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a href="profile.html" class="nav-item active" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">Profile</span>
      </a>

       <a href="agent-chat.html" class="nav-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/>
      <polyline points="8 6 2 12 8 18"/>
    </svg>
    <span class="nav-label">Code Review Agent</span>
  </a>

      

    <button class="nav-item logout-btn" id="logoutBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="nav-label">Logout</span>
    </button>
  </aside>

  <!-- ═══════════ MAIN WRAP ═══════════ -->
  <div class="main-wrap">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">PROFILE</span>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <main class="content">

      <!-- Profile Card -->
      <section class="profile-hero">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profileAvatar">
            <!-- Initial letter shown here -->
          </div>
        </div>
        <div class="profile-meta">
          <h1 class="profile-name" id="profileName">—</h1>
          <span class="status-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="9 12 11 14 15 10" stroke="white" stroke-width="2.5" fill="none"/>
            </svg>
            Active
          </span>
        </div>
      </section>

      <!-- Account Details -->
      <section class="section-block">
        <h2 class="section-title">ACCOUNT DETAILS</h2>
        <div class="profile-details-card">

          <div class="detail-row">
            <div class="detail-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </div>
            <div class="detail-body">
              <span class="detail-label">Email Address</span>
              <span class="detail-value" id="detailEmail">—</span>
            </div>
          </div>

          <div class="detail-divider"></div>

          

          <div class="detail-divider"></div>

          <div class="detail-row">
            <div class="detail-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <div class="detail-body">
              <span class="detail-label">User ID (UID)</span>
              <span class="detail-value detail-uid" id="detailUid">—</span>
            </div>
          </div>

          <div class="detail-divider"></div>

    

          <div class="detail-divider"></div>

          <div class="detail-row">
            <div class="detail-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8"  y1="2" x2="8"  y2="6"/>
                <line x1="3"  y1="10" x2="21" y2="10"/>
              </svg>
            </div>
            <div class="detail-body">
              <span class="detail-label">Account Created</span>
              <span class="detail-value" id="detailCreated">—</span>
            </div>
          </div>

          <div class="detail-divider"></div>

          <div class="detail-row">
            <div class="detail-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="detail-body">
              <span class="detail-label">Last Sign-In</span>
              <span class="detail-value" id="detailLastLogin">—</span>
            </div>
          </div>

          <div class="detail-divider"></div>

          <div class="detail-row">
            <div class="detail-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="detail-body">
              <span class="detail-label">Sign-in Provider</span>
              <span class="detail-value" id="detailProvider">—</span>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
